<?xml version="1.0" encoding="UTF-8"?>
<!--
  ui.xhtml — declarative interface for {{projectName}}.

  This is the TS/XHTML authoring layer. It lowers to the same `nxs.*` widget
  bindings used by scripts/panels.lua, so both paths converge on the Lua
  widget runtime while numerical work stays in C++ and higher-level logic in
  Python.

  Layout: two compact panels (Training, Chart) — minimal, intuitive controls.
-->
<nexus-ui xmlns="https://nexus.dev/ns/ui/1" controller="./ui.ts#AppPage">
  <panel id="training" title="Training">
    <label text="{greeting}"/>
    <label text="Hours: {trainingHours}" digits="5"/>
    <label text="Generation {trainingGeneration} · best {trainingBest}"/>
    <label text="{trainingStatus}"/>
    <row>
      <button label="Start / Stop" on-click="toggleTraining"/>
      <button label="Reset" on-click="resetTraining"/>
    </row>
  </panel>

  <panel id="chart" title="Chart" fill="true">
    <row>
      <button label="Sine" on-click="addSine"/>
      <button label="Damped" on-click="addDamped"/>
    </row>
  </panel>
</nexus-ui>
